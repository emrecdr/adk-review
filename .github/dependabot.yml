# Each week: one pull request for the workflows' actions, one for the Python packages, and one each for google-adk and
# litellm, pinned where the docs' measurements were taken, so the rest never waits on a new measurement. Every release
# waits three days, the span `[tool.uv]` gives the lock, and no package skips the wait (`tests/test_copilot.py`). The
# README's sample workflow pins the same actions: move it in the actions' pull request.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["google-adk", "litellm"]
    ignore:
      # LiteLLM 1.107.0 shipped a credential stealer, and LiteLLM has not yet said its release accounts are safe
      # again: ADK caps it below 1.106.3 for the same reason. Lift this once LiteLLM says they are.
      - dependency-name: "litellm"
        versions: [">=1.106.3"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
