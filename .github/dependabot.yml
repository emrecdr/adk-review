# Each week: one pull request for the workflows' actions, one for the Python packages, and one each for google-adk and
# litellm, pinned where the docs' measurements were taken, so the rest never waits on a new measurement. Every release
# waits three days, the span `[tool.uv]` gives the lock, and no package skips the wait (`tests/test_copilot.py`). The
# README's sample workflow pins the same actions: move it in the actions' pull request.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["google-adk", "litellm"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
