# Every setting of `adk-review-tui`, as an example: this file is read by no code. The config it reads is the one its
# screen names in its first line: `tui/.tui.toml` in a checkout, `tui.toml` in your config folder for an installed
# copy. Copy what you need from here into it.
#
# Keybindings in the TUI:
#   Ctrl+R  Run Review        Ctrl+D  Dry Run            Ctrl+X  Stop Running Review
#   Ctrl+T  Fold/Unfold All   Ctrl+P  Command Palette    Ctrl+Y  Copy Active Tab
#   F5      Fetch & Refresh   1..7    Toggle Section 1-7
# tui/README.md says what each setting and key does.

[workspace]
# One or more root folders containing your local Git repositories.
# Accepts plain path strings or inline `{ label = "...", path = "..." }` tables.
# When multiple entries are listed, the TUI asks you to select the root folder first,
# then lists the repositories inside that root folder (chain of selects).
root_dirs = [
    "~/Projects",
    # { label = "Work Repos", path = "~/Projects/work" },
]
scan_depth = 2
fetch_timeout_s = 15
# output_dir = "reviews"   # where each review's files go; by default your state folder's outputs, a relative path read
#                          # from this file's own folder

[defaults]
profile = "default"
fail_on = "blocker"
comment = true
handoff = false
verify = false
use_cache = true
auto_previous = true

# Per-repository saved presets (updated automatically when you run a review, or edited by hand)
[projects."adk_review"]
base = "main"
profile = "default"
fail_on = "blocker"
comment = true
handoff = false
verify = false
path = []
path_exclude = ["docs/reports"]
