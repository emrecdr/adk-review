[project]
name = "adk-review-tui"
version = "0.1.0"
description = "A terminal front end for adk-review: an application of its own, on top of the reviewer."
# As the reviewer's own: the two install into one environment.
requires-python = ">=3.14,<3.15"
dependencies = [
    # The reviewer, from this same checkout: the workspace source below. A pipeline installs it alone.
    "adk-review",
    "textual>=8.0,<9.0",
    # Its own calls to Azure DevOps verify certificates through the system's store, as the reviewer's do: named
    # here too, as the reviewer names it, since the front end imports it itself.
    "truststore>=0.10",
]

[project.scripts]
adk-review-tui = "tui:run"

[tool.uv.sources]
adk-review = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tui"]
