# A local SonarQube for the IDE, as README.md's "SonarQube in the IDE" walks through: the server and its database,
# and the scanner under the `scanner` profile. Each image is pinned by its digest, the tag beside it, as a workflow
# pins an action by its commit: a tag can be moved to other bytes, a digest cannot. Each was taken at least three
# days after it was published, the span `[tool.uv]` gives a release.
services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community@sha256:c0f1160bccfa435db4168c2d7df69af3c3ea7bfeb87395613014048fb33a68c1
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:9000:9000" # this machine alone: until its password is changed, the server's admin is admin/admin
    environment:
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  db:
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    container_name: sonarqube_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0@sha256:a3f4215076706c95a17a68c19322ee916e40a3acd081a8c1a1e839e0194afa57
    platform: linux/amd64 # the scanner is published for amd64 alone; an arm64 machine runs it emulated
    container_name: sonar_scanner
    depends_on:
      - sonarqube
    profiles:
      - scanner
    environment:
      - SONAR_HOST_URL=http://sonarqube:9000
      - SONAR_TOKEN # from the shell that runs it, never written here
    volumes:
      - .:/usr/src
    restart: "no"

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  postgresql_data:
