[project]
name = "adk-review"
version = "0.1.0"
description = "A git-branch code reviewer for Python projects, on Google ADK: rules decided by code, guidelines judged by a model, on Copilot and on Gemini."
requires-python = ">=3.13"
dependencies = [
    # Pinned: every measurement in the docs was taken on it. With no extra: the Copilot arm's litellm is a dependency of
    # its own below, and of the extra's other packages, crewai, langgraph, llama-index, kubernetes, docker and nltk
    # among them, the reviewer imports none: it serves Copilot and Gemini only.
    "google-adk==2.12.0",
    # The Copilot arm, pinned at the lock's own version for an install that reads no lock: `uv tool install`, pip and
    # pre-commit resolve afresh, and ADK with no extra asks for no litellm. Measured: `uv tool install .` took a release
    # three days old or less, as LiteLLM 1.82.7 and 1.82.8 were when they shipped a credential stealer.
    "litellm==1.106.0",
    "python-dotenv>=1.0",
    # Certificates verified through the operating system's own store: a company proxy's root the machine trusts,
    # Python trusts too. judge/config.py injects it before any client is built, and so does the login.
    "truststore>=0.10",
    # The lint rule runs ruff, and the types rule pyrefly; installed with the reviewer, each is found beside the
    # interpreter.
    "ruff>=0.12.8",
    "pyrefly>=1.4.0",
]

# `adk-review`: the command, installed where it is needed — `uv tool install <this repository>` — and run from any
# folder, with `adk-review-push`, its pre-push hook, and `adk-review-login`, the Copilot arm's one-time login.
[project.scripts]
adk-review = "adk_review.review:run"
adk-review-push = "adk_review.push:run"
adk-review-login = "adk_review.login:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adk_review"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# A test still running after five minutes prints every thread's stack and ends the run; the slowest takes seconds.
# Measured: one full run stalled about half way, ten minutes and more, and never again in five; CI would have cancelled
# it at its twenty-minute limit with nothing to read.
faulthandler_timeout = 300
faulthandler_exit_on_timeout = true
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*EXPERIMENTAL.*:UserWarning",
    # pydantic on a TypedDict litellm declares with ReadOnly: litellm's own types, woken by the first litellm error built
    "ignore:Item 'summary' on TypedDict class 'ChatCompletionReasoningItem':UserWarning",
]

[tool.uv]
# A release is taken three days after it is published, never sooner: measured, LiteLLM 1.82.7 and 1.82.8 shipped a
# credential stealer on PyPI for 2 h 32 min, and the registry's own advice after it was a cooldown beside the lock.
# The lock records the span, not a date, so `uv sync --locked` holds day after day.
exclude-newer = "P3D"
# The uv that reads the lock's span; an older one stops with this sentence instead of misreading the file.
required-version = ">=0.12"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ARG", "ASYNC", "RUF", "BLE001", "S607", "SIM", "RET", "C4", "PIE", "PT", "C90", "PERF", "FURB"]
# SIM112 would upper-case Windows' own `SystemRoot` and `NoDefaultCurrentDirectoryInExePath`; PT018 would split
# asserts that read as one sentence.
ignore = ["SIM112", "PT018"]

[tool.ruff.lint.mccabe]
# No function past McCabe complexity 10, the bar of the Health section's lowest band. Measured when it was set: three
# functions past it held the package to a B by its own Health section, each split along its own steps, and it read A.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# The demo's builder and the fixtures run the developer's own git in folders they made; the reviewer, which may run
# inside a checkout under review, finds git by its full path and is held to S607.
"scripts/make_demo_repo.py" = ["S607"]
"scripts/measure.py" = ["S607"]
"tests/*" = ["S607"]

[tool.pyrefly]
# The tests are not type checked, in `make typecheck`, CI or an editor: they hand the code partial and wrong values on
# purpose, an entry of two keys or a severity off the scale. An editor still resolves, hovers and completes in them.
project-excludes = ["tests/**"]
search-path = [".", "scripts"]

[tool.pyrefly.errors]
# ADK declares LlmAgent(BaseAgent, abc.ABC) with no abstract method; AnyRule is still held by bad-instantiation
direct-abstract-base-instantiation = "ignore"

[tool.pyright]
extraPaths = ["scripts"]

