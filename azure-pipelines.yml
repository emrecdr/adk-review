# The checks of .github/workflows/ci.yml for the Azure DevOps copy of this repository: the lint, the type check and the
# offline suite on the three platforms the reviewer runs on. No model is called, so the pipeline needs no key, no login
# and no variable group. A pull request in Azure Repos runs it through a branch policy (build validation), not from
# here.

trigger:
  branches:
    include:
      - "*"

jobs:
  - job: test
    strategy:
      matrix:
        windows:
          vmImage: windows-latest
        linux:
          vmImage: ubuntu-latest
        macos:
          vmImage: macos-latest
    pool:
      vmImage: $(vmImage)
    # A hung git once hung a review, and the hosted agents' own limit is sixty minutes.
    timeoutInMinutes: 20
    steps:
      # Read-only: the pipeline checks, and writes nothing back; the checkout keeps no token, the default.
      - checkout: self
      # Any Python the agent has, for pip; uv reads .python-version and fetches 3.13 itself where the agent lacks it.
      - task: UsePythonVersion@0
        displayName: a Python for pip
        inputs:
          versionSpec: "3.x"
      - script: python -m pip install uv==0.13.4 # pinned, as the GitHub workflows pin it
        displayName: install uv
      - script: git --version
      - script: uv sync --locked
      - script: uv run ruff check .
      - script: uv run ruff format --check .
      - script: uv run pyrefly check
      - script: uv run pytest -q
