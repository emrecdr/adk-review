# The reviewer's one config file: how it reviews. It is read from this folder alone, never from the repository under
# review. It is read whole: a key it does not know, or
# one missing, is refused and named, never ignored. A command-line flag overrides a setting for one run. The provider,
# the models and the keys are the environment's, or the .env's at the root of the checkout, which is never committed.

[review]
fail_on = "blocker"  # exit 1 at or above this severity: minor, major or blocker (--fail-on)
max_tokens = 0       # stop spending past this many tokens; 0 is no ceiling (--max-tokens)
verify = false       # a second opinion on each guideline's finding no rule already made (--verify, --no-verify)
diff_cap = 16000     # characters of a file's diff a guideline reads; a file cut there is named "not read" (--diff-cap)
# Globs of changed files the guidelines leave to the rules, each named, never a hole; --skip adds more for one run.
# Images and fonts, in either case: no rule and no model reads one, and measured, a branch adding a logo alone ended
# in exit 3 and its push stopped, which only --no-verify, skipping the credential rules too, let through. Not an
# archive, a keystore or a document, which can carry a credential, nor an SVG, which is text the guidelines read.
# And lockfiles, each written whole by its package manager: no guideline judges a resolved version or a hash, and
# measured, a dependency bump cut `uv.lock` at the cap and ended in exit 3. The rules still read every line, a
# credential in a registry's URL among what they find. Not bun's binary `bun.lockb`, which no rule can read.
skip = [
    "*.png", "*.PNG", "*.jpg", "*.JPG", "*.jpeg", "*.JPEG", "*.gif", "*.GIF", "*.webp", "*.WEBP", "*.ico", "*.ICO",
    "*.bmp", "*.BMP", "*.tif", "*.TIF", "*.tiff", "*.TIFF", "*.avif", "*.AVIF", "*.heic", "*.HEIC", "*.heif", "*.HEIF",
    "*.woff", "*.WOFF", "*.woff2", "*.WOFF2", "*.ttf", "*.TTF", "*.otf", "*.OTF", "*.eot", "*.EOT",
    "uv.lock", "poetry.lock", "Pipfile.lock", "pdm.lock", "package-lock.json", "npm-shrinkwrap.json", "yarn.lock",
    "pnpm-lock.yaml", "bun.lock", "deno.lock", "Cargo.lock", "go.sum", "Gemfile.lock", "composer.lock", "mix.lock",
    "pubspec.lock", "Podfile.lock", "Package.resolved", "packages.lock.json", "gradle.lockfile", "flake.lock",
]
# Globs of the changed files a review reads, at any depth: Python's and notebooks, the configs beside them, a
# credential's own files, keys and key stores, and what a coding agent or another tool obeys; --scan adds more for one
# run, and an empty list reads every file. A file with no suffix is read whatever this names: a script that runs Python
# is one, which only its first line tells; and so is a submodule, another repository's commit, a hole no rule can read.
# Any other changed file is ignored: no guideline reads it and no tree parses it, and the report lists it, never a hole.
# The credential rules alone still read the project's own, in a review and in each commit a push sends, a link as the
# file it names: one whose file they could not read is their hole.
scan = [
    # Python's own files, notebooks, and a `.pth`, which Python runs at every start
    "*.py", "*.pyi", "*.pyw", "*.pth", "*.ipynb",
    # the configs beside them, requirements and lockfiles among them
    "*.toml", "*.cfg", "*.ini", "*.conf", "*.yaml", "*.yml", "*.json", ".env", "*.env", ".env.*", "Pipfile",
    "requirements*.txt", "requirements*.in", "constraints*.txt", "**/requirements/*.txt", "**/requirements/*.in",
    "*.lock", "go.sum", "gradle.lockfile", "Package.resolved", "Dockerfile*", "*.Dockerfile",
    # a credential's own files, keys and key stores
    "*.pem", "*.key", "*.p8", "*.p12", "*.pfx", "*.jks", "*.keystore", "*.ppk", "*.gpg", "*.asc",
    # what a coding agent or another tool obeys, each folder `rule.steering-files` names read whole
    "CLAUDE.md", "AGENTS.md", "GEMINI.md", ".cursorrules", ".windsurfrules", ".clinerules", "*.code-workspace",
    ".github/copilot-instructions.md", ".github/instructions/", ".github/agents/", ".github/prompts/",
    ".github/skills/", ".github/chatmodes/", ".github/workflows/", ".claude/", ".gemini/", ".agents/", ".agent/",
    ".cursor/", ".clinerules/", ".windsurf/", ".kiro/", ".junie/", ".roo/", ".amazonq/", ".continue/",
    ".devcontainer/",
]
# Globs of the folders holding other projects' code a repository keeps beside its own, vendored or installed, at any
# depth, and a virtual environment's `venv` at the top alone, a name a project's own package has too: read by review,
# Hatch's `src/hatch/venv/` was ignored. --third-party adds more for one run. A review is of a project's own code, never
# of a library it keeps: a file under one is ignored, whatever `scan` names. Code a branch puts under one goes
# unreviewed too, so a folder belongs here only where what it holds is another project's.
third_party = [
    "**/vendor/**", "**/vendored/**", "**/_vendor/**", "**/third_party/**", "**/third-party/**", "**/thirdparty/**",
    "**/node_modules/**", "**/bower_components/**", "**/jspm_packages/**", "**/site-packages/**",
    "**/dist-packages/**", "**/.venv/**", "venv/**", "**/__pypackages__/**", "**/Pods/**", "**/Carthage/**",
]

# Named lists of the checks a review runs, chosen with --profile NAME; with no --profile a review runs `default`.
# A check is a rule, decided by code, one file in judge/rules/, or a guideline, judged by a model, one file in
# judge/guidelines/. A profile names each by its id, rule.<name> or guideline.<name>, as --list-checks prints them,
# or every check of a kind by the group `rules` or `guidelines`. A check runs only where a profile names it, or alone
# with --check ID: a new rule joins every profile that names `rules` at once, as `demo` does, and `rules-only`,
# `full` and `default` when its id is added to them.
[profiles]
# The basics, what a review runs when no --profile names another: the rules every project wants — a credential, by a
# vendor's shape or by the name it is given, and lint — the two that guard the review itself — against a diff that gives
# the guidelines orders, and against an encoding that hides code from every rule — where a lockfile, which the skip list
# leaves to the rules, fetches from, an action a workflow runs at a ref that can be moved, Python's traps ruff can prove
# — measured at 0.00 to 0.03 a thousand lines of four mature projects once the codes whose findings were idioms were
# left out, all but one of those read a real defect — and the three guidelines.
default = [
    "rule.secrets", "rule.named-secrets", "rule.lint", "rule.reviewer-instructions", "rule.encoding-declaration",
    "rule.lockfile-sources", "rule.pinned-actions", "rule.pitfalls", "guideline.security", "guideline.tests",
    "guideline.complexity",
]
# The default's rules and no model: what fits any project's every pull request, with no key needed. Kept to the
# default's rules, a test holds it so; the payments project's own rules are in `demo`.
default-rules = [
    "rule.secrets", "rule.named-secrets", "rule.lint", "rule.reviewer-instructions", "rule.encoding-declaration",
    "rule.lockfile-sources", "rule.pinned-actions", "rule.pitfalls",
]
# What the pre-push hook reads each commit a push sends with, beside its review of the change with `default-rules`: a
# credential one commit adds and a later one takes out is still in the history the remote receives. A commit is read
# line by line and by code alone, so it names line rules only.
push-history = ["rule.secrets", "rule.named-secrets"]
# No model at all: every rule but the payments demo's, fast enough for every push, and no key needed. Each rule is named
# by its id, as a test holds this list and `full`'s to every rule whose id does not start with `demo-`: a rule written
# for one project, as the demo's are, would report another project's folders and money missing.
rules-only = [
    "rule.encoding-declaration", "rule.hidden-text", "rule.lint", "rule.lockfile-sources", "rule.named-secrets",
    "rule.no-print", "rule.pinned-actions", "rule.pitfalls", "rule.private-patch", "rule.reviewer-instructions",
    "rule.secrets", "rule.simplify", "rule.steering-files", "rule.tests-offline",
]
# Every check there is but the payments demo's rules: `rules-only`'s and every guideline.
full = [
    "rule.encoding-declaration", "rule.hidden-text", "rule.lint", "rule.lockfile-sources", "rule.named-secrets",
    "rule.no-print", "rule.pinned-actions", "rule.pitfalls", "rule.private-patch", "rule.reviewer-instructions",
    "rule.secrets", "rule.simplify", "rule.steering-files", "rule.tests-offline", "guidelines",
]
# A simplify pass, as Claude Code's /simplify reads a change: the cleanup ruff can name, and the complexity, the
# wasted work and the fix at the wrong depth a model judges, three calls. lint and pitfalls run beside them, at no cost,
# for the defects a cleanup must not paper over.
simplify = [
    "rule.lint", "rule.pitfalls", "rule.simplify", "guideline.complexity", "guideline.efficiency", "guideline.altitude",
]
# A code review, as Claude Code's /code-review reads a change: the default's rules, Python's traps among them,
# correctness and security, then the simplify pass's cleanup, five calls. Its conventions angle is left out: it obeys
# the reviewed repository's own CLAUDE.md, the file steering-files names as one a person reads first.
code-review = [
    "rule.secrets", "rule.named-secrets", "rule.lint", "rule.reviewer-instructions", "rule.encoding-declaration",
    "rule.lockfile-sources", "rule.pinned-actions", "rule.pitfalls", "rule.simplify", "guideline.correctness",
    "guideline.security", "guideline.complexity", "guideline.efficiency", "guideline.altitude",
]
# The payments demo's, as scripts/make_demo_repo.py builds it: every rule, the demo's own among them, and no model.
demo = ["rules"]
