# What the scanner reads, for the local SonarQube README.md's "SonarQube in the IDE" sets up. No version is named:
# pyproject.toml holds the one, and a copy here would drift from it.
sonar.projectKey=adk-review
sonar.projectName=adk-review

# The package and its scripts, as pyrefly reads them; the tests apart, as tests
sonar.sources=adk_review,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language specifics
sonar.python.version=3.13

# Exclusions
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/.ruff_cache/**,**/.git/**
